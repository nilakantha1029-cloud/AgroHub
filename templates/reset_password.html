<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — AgroHub</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='Assets/favicon.png') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:url('/static/Assets/signup_bg.jpg') no-repeat center center/cover;padding:20px;}
    body::before{content:'';position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:0;}
    .card{position:relative;z-index:1;background:rgba(255,255,255,0.97);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,0.25);padding:44px 42px 36px;width:min(460px,94vw);}
    .logo-row{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
    .logo-icon{font-size:32px;}
    h1{font-size:24px;color:#2e5d2e;}
    .subtitle{color:#666;font-size:14px;margin-bottom:28px;}
    .invalid-banner{background:#fff3e0;border-left:4px solid #ff9800;border-radius:10px;padding:16px 18px;margin-bottom:20px;font-size:14px;color:#e65100;display:none;}
    .invalid-banner a{color:#2e7d32;font-weight:700;}
    .form-group{margin-bottom:18px;}
    label{display:block;font-size:13px;font-weight:700;color:#444;margin-bottom:6px;}
    .input-wrap{position:relative;}
    .input-wrap i.icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#6fa96f;font-size:14px;}
    .input-wrap i.toggle{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:#6fa96f;font-size:14px;cursor:pointer;}
    .input-wrap input{width:100%;padding:11px 40px 11px 38px;border:2px solid #c8e6c9;border-radius:10px;font-size:14px;transition:border .2s;}
    .input-wrap input:focus{outline:none;border-color:#2e7d32;}
    .strength-bar{height:4px;border-radius:2px;margin-top:6px;background:#eee;overflow:hidden;}
    .strength-fill{height:100%;border-radius:2px;width:0;transition:width .3s,background .3s;}
    .strength-text{font-size:11px;margin-top:3px;height:14px;color:#888;}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,#6fa96f,#2e5d2e);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;transition:opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
    .btn:hover{opacity:.9;}
    .btn:disabled{background:#aaa;cursor:not-allowed;opacity:1;}
    .msg{margin-top:16px;padding:13px 16px;border-radius:10px;font-size:14px;line-height:1.5;display:none;}
    .msg.success{background:#e8f5e9;color:#1b5e20;border-left:4px solid #2e7d32;display:block;}
    .msg.error{background:#ffebee;color:#c62828;border-left:4px solid #e53935;display:block;}
    .back-link{display:inline-flex;align-items:center;gap:6px;color:#2e7d32;text-decoration:none;font-size:13px;font-weight:600;margin-bottom:22px;}
    .back-link:hover{opacity:.75;}
  </style>
</head>
<body>
<div class="card">
  <a href="/login" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
  <div class="invalid-banner" id="invalidBanner">
    ⚠️ This reset link is <strong>invalid or has expired</strong>.
    <a href="/forgot-password">Request a new one →</a>
  </div>
  <div class="logo-row"><span class="logo-icon">🌾</span><h1>Reset Password</h1></div>
  <p class="subtitle">Enter and confirm your new password below.</p>
  <div id="resetForm">
    <div class="form-group">
      <label>New Password *</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock icon"></i>
        <input type="password" id="newPass" placeholder="Min 8 chars, uppercase, number, symbol" oninput="checkStrength(this.value)"/>
        <i class="fa-solid fa-eye toggle" onclick="toggleVis('newPass',this)"></i>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      <div class="strength-text" id="strengthText"></div>
    </div>
    <div class="form-group">
      <label>Confirm New Password *</label>
      <div class="input-wrap">
        <i class="fa-solid fa-lock icon"></i>
        <input type="password" id="confirmPass" placeholder="Re-enter your new password"/>
        <i class="fa-solid fa-eye toggle" onclick="toggleVis('confirmPass',this)"></i>
      </div>
    </div>
    <button class="btn" id="resetBtn" onclick="doReset()">
      <i class="fa-solid fa-key"></i> Reset Password
    </button>
    <div class="msg" id="msgBox"></div>
  </div>
</div>
<script>
  const params=new URLSearchParams(window.location.search);
  const token=params.get('token');
  if(!token){document.getElementById('invalidBanner').style.display='block';document.getElementById('resetForm').style.display='none';}
  function checkStrength(val){
    const fill=document.getElementById('strengthFill');const text=document.getElementById('strengthText');
    if(!val){fill.style.width='0';text.textContent='';return;}
    let s=0;if(val.length>=8)s++;if(/[A-Z]/.test(val))s++;if(/\d/.test(val))s++;if(/[@$!%*?&]/.test(val))s++;
    const map=[['0%','#eee',''],['25%','#e53935','⚠ Weak'],['55%','#ff9800','▲ Medium'],['80%','#66bb6a','● Good'],['100%','#2e7d32','✔ Strong']];
    const[w,c,t]=map[s]||map[0];fill.style.width=w;fill.style.background=c;text.textContent=t;text.style.color=c;
  }
  function toggleVis(id,icon){
    const inp=document.getElementById(id);
    if(inp.type==='password'){inp.type='text';icon.classList.replace('fa-eye','fa-eye-slash');}
    else{inp.type='password';icon.classList.replace('fa-eye-slash','fa-eye');}
  }
  async function doReset(){
    const btn=document.getElementById('resetBtn');const msgBox=document.getElementById('msgBox');
    const newPass=document.getElementById('newPass').value;const confirm=document.getElementById('confirmPass').value;
    msgBox.className='msg';
    if(!newPass||!confirm){showMsg('Please fill in both fields.','error');return;}
    if(newPass!==confirm){showMsg('Passwords do not match.','error');return;}
    btn.disabled=true;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Resetting…';
    try{
      const res=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,new_password:newPass,confirm_password:confirm})});
      const data=await res.json();
      if(data.success){showMsg('✅ Password reset! Redirecting to login…','success');document.querySelectorAll('#resetForm input').forEach(i=>i.disabled=true);setTimeout(()=>window.location.href='/login',2500);}
      else{showMsg(data.error||'Reset failed. Please try again.','error');btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-key"></i> Reset Password';}
    }catch{showMsg('Network error. Please try again.','error');btn.disabled=false;btn.innerHTML='<i class="fa-solid fa-key"></i> Reset Password';}
  }
  function showMsg(t,type){const m=document.getElementById('msgBox');m.className='msg '+type;m.textContent=t;}
  document.addEventListener('keydown',e=>{if(e.key==='Enter')doReset();});
</script>
</body>
</html>
